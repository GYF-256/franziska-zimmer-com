name: Import vetted WordPress media (one-time)
on:
  push:
    paths:
      - scripts/import-media.py
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  import-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out current repository
        uses: actions/checkout@v4
      - name: Fetch or extract ten vetted public WordPress images
        run: python scripts/import-media.py
      - name: Commit imported media and remove temporary ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- public/wp-content/uploads
          if git ls-files --error-unmatch migration-media.zip >/dev/null 2>&1; then
            git add -A -- migration-media.zip
          fi
          if ! git diff --cached --quiet; then
            git commit -m "assets: import vetted published WordPress images"
            git push
          fi
      - name: Build migrated Astro website
        uses: withastro/action@v6
      - name: Deploy imported website
        id: deployment
        uses: actions/deploy-pages@v5
