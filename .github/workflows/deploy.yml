name: Deploy Astro to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Astro site
        run: npm run build
      - name: Verify homepage, styles and images before upload
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          grep -q "Franziska Zimmer" dist/index.html
          grep -q "TikTok Stars Are Turning" dist/index.html
          grep -q "Google Scholar" dist/index.html
          grep -q "I study user behavior in digital systems" dist/index.html
          test -s dist/wp-content/uploads/2026/02/FranziskaZimmer-002.jpg
          test -s "dist/wp-content/uploads/2026/03/cropped-名称未設定のデザイン1-317x106.png"
          test -s dist/media/wired-livestream.jpg
          test -s dist/media/forbes-livestream.jpg
          test -s dist/media/compliance-prediction.webp
          if ! grep -q '<style' dist/index.html && ! grep -q 'stylesheet' dist/index.html; then
            echo "ERROR: No stylesheet included in generated homepage"
            exit 1
          fi
          if ! grep -Rq 'home-hero' dist/_astro/; then
            echo "ERROR: Homepage CSS missing from generated CSS assets"
            exit 1
          fi
          # About must retain Elementor's complete content hierarchy, not just text.
          test -s dist/about/index.html
          grep -q 'data-elementor-id="269"' dist/about/index.html
          grep -q 'profile-timeline' dist/about/index.html
          grep -q 'Academic Service' dist/about/index.html
          if ! grep -Rq 'fz-about' dist/_astro/; then
            echo "ERROR: About page layout CSS is missing from the generated assets"
            exit 1
          fi
          echo "Homepage and About markup/CSS assets verified"
      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
